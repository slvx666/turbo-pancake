name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest] # macos-latest = Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Toolchain version comes from rust-toolchain.toml. llvm-tools (rust-objcopy) is
      # needed by the bundled WebRTC APM build the desktop client links (ADR 0006).
      - name: Install toolchain + llvm-tools
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add llvm-tools

      - name: Linux system packages (winit/X11/Wayland, fontconfig, ALSA, libclang)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev libgl1-mesa-dev pkg-config libclang-dev

      - name: meson + ninja (WebRTC APM build)
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/tp-tools/venv" || python -m venv "$RUNNER_TEMP/tp-tools/venv"
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/tp-tools/venv/Scripts"; else bin="$RUNNER_TEMP/tp-tools/venv/bin"; fi
          "$bin/python" -m pip install --quiet meson ninja
          echo "$bin" >> "$GITHUB_PATH"
          echo "TURBO_PANCAKE_TOOLS=$RUNNER_TEMP/tp-tools" >> "$GITHUB_ENV"

      # cmake crate + Visual Studio generator autodetection drops /O2 from libopus;
      # naming the generator explicitly keeps CMake's Release flags (ADR 0006).
      # `nm` (llvm-nm) is needed by the APM meson build.
      - name: Windows tools (CMake generator, nm)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          vs=$("$vswhere" -latest -property installationPath)
          llvm="$(cygpath "$vs")/VC/Tools/Llvm/x64/bin"
          [ -x "$llvm/llvm-nm.exe" ] || llvm="/c/Program Files/LLVM/bin"
          mkdir -p "$RUNNER_TEMP/tp-tools/bin"
          cp "$llvm/llvm-nm.exe" "$RUNNER_TEMP/tp-tools/bin/nm.exe"
          major=$("$vswhere" -latest -property installationVersion | cut -d. -f1)
          case "$major" in 16) year=2019 ;; 17) year=2022 ;; 18) year=2026 ;; *) echo "unknown VS $major"; exit 1 ;; esac
          echo "CMAKE_GENERATOR=Visual Studio $major $year" >> "$GITHUB_ENV"
          # Short target dir: the APM meson build's object paths under
          # target/release/build/.../out exceed MAX_PATH (LNK1181 on CI run 41454787623).
          echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Visual Studio $major $year"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> ${{ runner.os == 'Windows' && 'D:/t' || 'target' }}"

      - name: fmt
        run: cargo fmt --all -- --check

      # The desktop client enables media-audio/apm, so the workspace build runs the APM
      # (echo/noise) tests too. On Windows APM needs clang-cl in the VS environment.
      - name: clippy + test + release build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env_ps = "./benchmarks/scripts/apm-env.ps1"
          pwsh -NoProfile -File $env_ps cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File $env_ps cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File $env_ps cargo build --release --locked -p turbo-pancake-desktop -p turbo-pancake-app-server
          exit $LASTEXITCODE

      - name: clippy
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked

      - name: release build (size tracking)
        if: runner.os != 'Windows'
        run: cargo build --release --locked -p turbo-pancake-desktop -p turbo-pancake-app-server

      - name: desktop smoke (macOS, runner GUI session)
        if: runner.os == 'macOS'
        run: |
          cargo run --release --locked -p turbo-pancake-bench -- \
            --out-dir target/bench desktop-startup --exe target/release/turbo-pancake-desktop \
            --runs 2 --settle-ms 1000 --label ci-macos

      - name: desktop smoke (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a cargo run --release --locked -p turbo-pancake-bench -- \
            --out-dir target/bench desktop-startup --exe target/release/turbo-pancake-desktop \
            --runs 2 --settle-ms 1000 --label ci-xvfb --env SLINT_BACKEND=winit-software

      - name: voice codec cost
        run: cargo run --release --locked -p turbo-pancake-media-audio --example codec_cost

      - name: signaling benchmark smoke
        shell: bash
        run: |
          exe="${CARGO_TARGET_DIR:-target}/release/turbo-pancake-app-server"
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          cargo run --release --locked -p turbo-pancake-bench -- --out-dir target/bench \
            signaling --server-exe "$exe" --messages 200 --idle-connections 100

      - uses: actions/upload-artifact@v5
        with:
          name: bench-${{ matrix.os }}
          path: target/bench/*.json
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # audit-check publishes its result as a check run
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
