[package]
name = "turbo-pancake-media-audio"
description = "Voice pipeline: device I/O, resampling, Opus, jitter buffer (S1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cpal = "0.18"
opus = "0.4"
rtrb = "0.4"
rubato = "5"
thiserror.workspace = true
# WebRTC AudioProcessing (AEC3, NS, AGC2). Bundled build: needs meson + ninja, on Windows
# also clang-cl and llvm-tools (ADR 0006, `third_party/webrtc-audio-processing-sys`).
webrtc-audio-processing = { version = "=2.1.0", features = ["bundled"], optional = true }
webrtc-audio-processing-config = { version = "=2.1.0", optional = true }

[features]
apm = ["dep:webrtc-audio-processing", "dep:webrtc-audio-processing-config"]

[lints]
workspace = true
