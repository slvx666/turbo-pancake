// turbo-pancake realtime signaling protocol, version 1.
//
// Transport: WebSocket, one binary frame == one protobuf-encoded envelope.
// Client -> server frames are `ClientEnvelope`, server -> client are `ServerEnvelope`.
//
// Compatibility rules (see docs/API.md):
//   * field numbers are never reused; removed fields are `reserved`;
//   * new optional fields / oneof variants may be added within v1;
//   * an incompatible change requires a new package (`turbo_pancake.v2`) and a
//     new PROTOCOL_VERSION; the server answers an unsupported version with
//     Error{code = ERROR_CODE_UNSUPPORTED_VERSION} and closes the socket.
//
// Rooms (calls) may be joined without an account while the server runs on loopback
// (development, S1–S4 tests); messenger events need `Hello.auth_token` (S5, ADR 0013).
syntax = "proto3";

package turbo_pancake.v1;

import "turbo_pancake/v1/api.proto";

message ClientEnvelope {
  // Must equal the protocol version the client speaks (currently 1).
  uint32 protocol_version = 1;
  // Client-chosen correlation id, echoed in the direct response. 0 = no response expected.
  uint64 request_id = 2;

  oneof body {
    Hello hello = 10;
    JoinRoom join_room = 11;
    LeaveRoom leave_room = 12;
    Signal signal = 13;
    Ping ping = 14;
    MediaOffer media_offer = 15;
    MediaDatagram media_datagram = 16;
    ScreenShare screen_share = 17;
    SubscribeScreen subscribe_screen = 18;
    SubscribePreviews subscribe_previews = 19;
  }
}

message ServerEnvelope {
  uint32 protocol_version = 1;
  // Echo of ClientEnvelope.request_id for direct responses, 0 for unsolicited events.
  uint64 request_id = 2;
  // Monotonic per-connection event counter (starts at 1). Lets clients detect gaps
  // and deduplicate at-least-once redelivery in later protocol revisions.
  uint64 event_id = 3;

  oneof body {
    Welcome welcome = 10;
    RoomJoined room_joined = 11;
    PeerJoined peer_joined = 12;
    PeerLeft peer_left = 13;
    SignalRelay signal = 14;
    Pong pong = 15;
    Error error = 16;
    RoomLeft room_left = 17;
    MediaAnswer media_answer = 18;
    MediaDatagram media_datagram = 19;
    TrackPublished track_published = 20;
    TrackUnpublished track_unpublished = 21;
    ScreenShareState screen_share_state = 22;
    ScreenSubscription screen_subscription = 23;
    // Messenger events (S5), only on authenticated connections. At-least-once: dedup by
    // (conversation_id, change_seq); a gap means "fetch /changes".
    MessageEvent message_created = 24;
    MessageEvent message_edited = 25;
    MessageEvent message_deleted = 26;
    Receipt read_updated = 27;
    PresenceChanged presence_changed = 28;
    // A conversation appeared for this user or its members/blocks changed: refetch it.
    ConversationUpdated conversation_updated = 29;
    // This connection's session was revoked (logout elsewhere, password change); the
    // server closes the connection after it.
    SessionRevoked session_revoked = 30;
  }
}

// First message on every connection.
message Hello {
  // Free-form client build identifier, e.g. "turbo-pancake-desktop/0.1.0 (windows)".
  string client_version = 1;
  // Display name shown to other room members (1..=64 chars).
  string display_name = 2;
  // Session token from /v1/auth/*. Empty = anonymous (calls only, loopback servers).
  // With a token the display name comes from the account and field 2 is ignored.
  string auth_token = 3;
}

message Welcome {
  // Server-assigned identifier of this connection (opaque string).
  string peer_id = 1;
  string server_version = 2;
  // The client must send some frame (e.g. Ping) at least this often or it is disconnected.
  uint32 heartbeat_interval_ms = 3;
  uint32 max_frame_bytes = 4;
  // The signed-in user; unset on anonymous connections.
  User user = 5;
}

message JoinRoom {
  // 1..=64 chars of [A-Za-z0-9_-].
  string room_id = 1;
}

message LeaveRoom {
  string room_id = 1;
}

message Peer {
  string peer_id = 1;
  string display_name = 2;
}

message RoomJoined {
  string room_id = 1;
  // Members present before this peer joined (excluding self).
  repeated Peer peers = 2;
}

message RoomLeft {
  string room_id = 1;
}

message PeerJoined {
  string room_id = 1;
  Peer peer = 2;
}

message PeerLeft {
  string room_id = 1;
  string peer_id = 2;
  LeaveReason reason = 3;
}

enum LeaveReason {
  LEAVE_REASON_UNSPECIFIED = 0;
  LEAVE_REASON_LEFT = 1;
  LEAVE_REASON_DISCONNECTED = 2;
  LEAVE_REASON_TIMEOUT = 3;
  // Joined another room: the new call closed this one (one active call per user).
  LEAVE_REASON_SWITCHED = 4;
}

message SessionDescription {
  SdpType sdp_type = 1;
  string sdp = 2;
}

enum SdpType {
  SDP_TYPE_UNSPECIFIED = 0;
  SDP_TYPE_OFFER = 1;
  SDP_TYPE_ANSWER = 2;
}

message IceCandidate {
  // RFC 8839 candidate attribute value. Empty string marks the end of candidates.
  string candidate = 1;
  string sdp_mid = 2;
  uint32 sdp_mline_index = 3;
}

// Peer-to-peer signaling payload, relayed by the server inside one room.
message Signal {
  string room_id = 1;
  string to_peer_id = 2;
  oneof payload {
    SessionDescription description = 10;
    IceCandidate ice_candidate = 11;
  }
}

message SignalRelay {
  string room_id = 1;
  string from_peer_id = 2;
  oneof payload {
    SessionDescription description = 10;
    IceCandidate ice_candidate = 11;
  }
}

message Ping {
  // Client timestamp (opaque, echoed back) for RTT measurement.
  uint64 client_time_us = 1;
}

message Pong {
  uint64 client_time_us = 1;
}

message Error {
  ErrorCode code = 1;
  // Human-readable; never contains secrets or message content.
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED_VERSION = 1;
  ERROR_CODE_BAD_REQUEST = 2;
  ERROR_CODE_PAYLOAD_TOO_LARGE = 3;
  ERROR_CODE_HELLO_REQUIRED = 4;
  // No longer sent: joining another room switches to it (one active call per user).
  ERROR_CODE_ALREADY_IN_ROOM = 5;
  ERROR_CODE_NOT_IN_ROOM = 6;
  ERROR_CODE_PEER_NOT_FOUND = 7;
  ERROR_CODE_ROOM_FULL = 8;
  ERROR_CODE_INTERNAL = 9;
  // Hello with an unknown, expired or revoked token, or anonymous Hello where accounts
  // are required. The connection is closed after it.
  ERROR_CODE_UNAUTHENTICATED = 10;
}

// ---- Messenger events (S5, ADR 0013) ----

message MessageEvent {
  ChatMessage message = 1;
}

message PresenceChanged {
  string user_id = 1;
  bool online = 2;
}

message ConversationUpdated {
  string conversation_id = 1;
}

message SessionRevoked {
  string session_id = 1;
}

// ---- Media through the server (SFU) ----
//
// Every member of a room negotiates one WebRTC session (ICE + DTLS-SRTP, Opus) with the
// server, which forwards RTP between members without transcoding. The client offers;
// the server is ICE-lite and answers. Media travels either over UDP to the server or,
// when UDP is blocked (VPNs, firewalls), as the same encrypted datagrams inside this
// WebSocket (`MediaDatagram`), so a call works wherever signaling works.

enum MediaTransport {
  MEDIA_TRANSPORT_UNSPECIFIED = 0;
  // Datagrams over UDP to the server's media port (same number as the WebSocket port).
  MEDIA_TRANSPORT_UDP = 1;
  // Datagrams inside MediaDatagram frames of this connection.
  MEDIA_TRANSPORT_WEBSOCKET = 2;
}

// Client -> server, in the joined room. Replaces any previous media session of this
// connection. Answered by MediaAnswer (same request_id) or Error.
message MediaOffer {
  string room_id = 1;
  string sdp = 2;
  MediaTransport transport = 3;
  // IP address the client used to reach the server (the server offers it as its UDP
  // candidate; behind a port forward it is the public address). May be empty.
  string dialed_ip = 4;
}

message MediaAnswer {
  string room_id = 1;
  string sdp = 2;
  MediaTransport transport = 3;
}

// One media datagram (STUN, DTLS or SRTP/SRTCP) for MEDIA_TRANSPORT_WEBSOCKET,
// in either direction. The server never inspects its contents.
message MediaDatagram {
  bytes data = 1;
}

// Server -> client (spec §11 media.track_published): another member's audio arrives on
// this connection's media session as the RTP stream with this SSRC (one m-line, one SSRC
// per member, ADR 0008). Sent for every member already sending when the client's media
// session is accepted, then whenever a member's media session starts. A member's new
// session gets a new SSRC (a TrackUnpublished for the old one comes first).
message TrackPublished {
  string room_id = 1;
  string peer_id = 2;
  uint32 ssrc = 3;
  // Added in S3; absent (AUDIO) in older servers.
  TrackKind kind = 4;
  // Retransmission (RTX, RFC 4588) stream of a SCREEN track; 0 = none.
  uint32 rtx_ssrc = 5;
}

enum TrackKind {
  // The member's voice. Zero so that messages from before S3 keep their meaning.
  TRACK_KIND_AUDIO = 0;
  // The member's screen share video (H.264), on the session's video m-line. Announced
  // for every member like audio; RTP flows only while the receiver subscribes to it
  // (SubscribeScreen) and the member shares.
  TRACK_KIND_SCREEN = 1;
  // The share's system audio (Opus) on the session's second audio m-line; flows like
  // SCREEN, only to subscribers of the member's share.
  TRACK_KIND_SCREEN_AUDIO = 2;
  // The share's low-quality preview layer (S4, H.264, ~320 px / ~10 fps) on the session's
  // second video m-line; flows only to members that list the sharer in SubscribePreviews.
  TRACK_KIND_SCREEN_PREVIEW = 3;
}

// Server -> client (spec §11 media.track_unpublished): the member's stream ended (left
// the room, media session replaced or lost).
message TrackUnpublished {
  string room_id = 1;
  string peer_id = 2;
  uint32 ssrc = 3;
  TrackKind kind = 4;
}

// ---- Screen share (S3, spec §5) ----
//
// A member shares one whole monitor at a time as H.264 on the video m-line of its media
// session. The SFU forwards a share only to members that subscribed to it.

// Client -> server, in the joined room with a media session: starts, updates or stops
// this member's share. The server tells every member of the room (ScreenShareState).
message ScreenShare {
  string room_id = 1;
  bool active = 2;
  // Encoded picture size and frame rate (informational; 0 when stopping).
  uint32 width = 3;
  uint32 height = 4;
  uint32 fps = 5;
  // Target bitrate of the high layer (S4; used for the server's high-stream budget).
  uint32 bitrate_kbps = 6;
  // The member also sends a preview layer on its second video m-line (S4).
  bool preview = 7;
}

// Which layer of a share a viewer wants as its main (watched) picture (S4, spec §5.1:
// per-viewer quality, automatic and manual).
enum ScreenLayer {
  // The server picks: high unless the viewer's network loses packets or the server's
  // high-stream budget is used up, then low. Zero so S3 clients get the high layer.
  SCREEN_LAYER_AUTO = 0;
  SCREEN_LAYER_HIGH = 1;
  SCREEN_LAYER_LOW = 2;
}

// Client -> server: watch this member's share (empty peer_id = watch none). Replaces the
// previous subscription; the SFU asks the sharer for a keyframe. Sending it again with
// another layer switches the layer of the same stream (at the next keyframe).
message SubscribeScreen {
  string room_id = 1;
  string peer_id = 2;
  ScreenLayer layer = 3;
}

// Client -> server (S4): the shares this member shows as previews (their low layer),
// at most MAX_PREVIEWS; replaces the previous list, empty = none. Previews of members
// that do not share (yet) wait until they do.
message SubscribePreviews {
  string room_id = 1;
  repeated string peer_ids = 2;
}

// Why a viewer gets the layer it gets.
enum LayerReason {
  LAYER_REASON_UNSPECIFIED = 0;
  // The layer the viewer asked for (HIGH / LOW), or AUTO with nothing in the way.
  LAYER_REASON_REQUESTED = 1;
  // AUTO: the viewer's downlink loses packets.
  LAYER_REASON_NETWORK = 2;
  // The server's budget for high-quality streams is used up (spec §5.3 admission).
  LAYER_REASON_ADMISSION = 3;
  // The sharer sends one layer only (an S3 client): that one is forwarded.
  LAYER_REASON_SINGLE_LAYER = 4;
}

// Server -> client (spec §11 subscription.updated): the layer this connection receives
// for its watched share. Sent after every SubscribeScreen and whenever the layer changes.
message ScreenSubscription {
  string room_id = 1;
  string peer_id = 2;
  ScreenLayer requested = 3;
  // HIGH or LOW (what flows now, or what flows after the pending switch).
  ScreenLayer layer = 4;
  LayerReason reason = 5;
}

// Server -> client: a member started, changed or stopped sharing. Sent for every active
// share when the client's media session is accepted, then on every change (a member who
// leaves the room or loses its media session stops sharing).
message ScreenShareState {
  string room_id = 1;
  string peer_id = 2;
  bool active = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 fps = 6;
  uint32 bitrate_kbps = 7;
  // A preview layer exists for this share (S4).
  bool preview = 8;
}
