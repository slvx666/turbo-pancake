// turbo-pancake realtime signaling protocol, version 1.
//
// Transport: WebSocket, one binary frame == one protobuf-encoded envelope.
// Client -> server frames are `ClientEnvelope`, server -> client are `ServerEnvelope`.
//
// Compatibility rules (see docs/API.md):
//   * field numbers are never reused; removed fields are `reserved`;
//   * new optional fields / oneof variants may be added within v1;
//   * an incompatible change requires a new package (`turbo_pancake.v2`) and a
//     new PROTOCOL_VERSION; the server answers an unsupported version with
//     Error{code = ERROR_CODE_UNSUPPORTED_VERSION} and closes the socket.
//
// S0 scope: local development signaling (rooms + SDP/ICE relay) without
// authentication. The auth handshake is introduced in S5 (field 3 of Hello is
// reserved for the session token).
syntax = "proto3";

package turbo_pancake.v1;

message ClientEnvelope {
  // Must equal the protocol version the client speaks (currently 1).
  uint32 protocol_version = 1;
  // Client-chosen correlation id, echoed in the direct response. 0 = no response expected.
  uint64 request_id = 2;

  oneof body {
    Hello hello = 10;
    JoinRoom join_room = 11;
    LeaveRoom leave_room = 12;
    Signal signal = 13;
    Ping ping = 14;
  }
}

message ServerEnvelope {
  uint32 protocol_version = 1;
  // Echo of ClientEnvelope.request_id for direct responses, 0 for unsolicited events.
  uint64 request_id = 2;
  // Monotonic per-connection event counter (starts at 1). Lets clients detect gaps
  // and deduplicate at-least-once redelivery in later protocol revisions.
  uint64 event_id = 3;

  oneof body {
    Welcome welcome = 10;
    RoomJoined room_joined = 11;
    PeerJoined peer_joined = 12;
    PeerLeft peer_left = 13;
    SignalRelay signal = 14;
    Pong pong = 15;
    Error error = 16;
    RoomLeft room_left = 17;
  }
}

// First message on every connection.
message Hello {
  // Free-form client build identifier, e.g. "turbo-pancake-desktop/0.1.0 (windows)".
  string client_version = 1;
  // Display name shown to other room members (1..=64 chars).
  string display_name = 2;
  reserved 3;
  reserved "auth_token";
}

message Welcome {
  // Server-assigned identifier of this connection (opaque string).
  string peer_id = 1;
  string server_version = 2;
  // The client must send some frame (e.g. Ping) at least this often or it is disconnected.
  uint32 heartbeat_interval_ms = 3;
  uint32 max_frame_bytes = 4;
}

message JoinRoom {
  // 1..=64 chars of [A-Za-z0-9_-].
  string room_id = 1;
}

message LeaveRoom {
  string room_id = 1;
}

message Peer {
  string peer_id = 1;
  string display_name = 2;
}

message RoomJoined {
  string room_id = 1;
  // Members present before this peer joined (excluding self).
  repeated Peer peers = 2;
}

message RoomLeft {
  string room_id = 1;
}

message PeerJoined {
  string room_id = 1;
  Peer peer = 2;
}

message PeerLeft {
  string room_id = 1;
  string peer_id = 2;
  LeaveReason reason = 3;
}

enum LeaveReason {
  LEAVE_REASON_UNSPECIFIED = 0;
  LEAVE_REASON_LEFT = 1;
  LEAVE_REASON_DISCONNECTED = 2;
  LEAVE_REASON_TIMEOUT = 3;
}

message SessionDescription {
  SdpType sdp_type = 1;
  string sdp = 2;
}

enum SdpType {
  SDP_TYPE_UNSPECIFIED = 0;
  SDP_TYPE_OFFER = 1;
  SDP_TYPE_ANSWER = 2;
}

message IceCandidate {
  // RFC 8839 candidate attribute value. Empty string marks the end of candidates.
  string candidate = 1;
  string sdp_mid = 2;
  uint32 sdp_mline_index = 3;
}

// Peer-to-peer signaling payload, relayed by the server inside one room.
message Signal {
  string room_id = 1;
  string to_peer_id = 2;
  oneof payload {
    SessionDescription description = 10;
    IceCandidate ice_candidate = 11;
  }
}

message SignalRelay {
  string room_id = 1;
  string from_peer_id = 2;
  oneof payload {
    SessionDescription description = 10;
    IceCandidate ice_candidate = 11;
  }
}

message Ping {
  // Client timestamp (opaque, echoed back) for RTT measurement.
  uint64 client_time_us = 1;
}

message Pong {
  uint64 client_time_us = 1;
}

message Error {
  ErrorCode code = 1;
  // Human-readable; never contains secrets or message content.
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED_VERSION = 1;
  ERROR_CODE_BAD_REQUEST = 2;
  ERROR_CODE_PAYLOAD_TOO_LARGE = 3;
  ERROR_CODE_HELLO_REQUIRED = 4;
  ERROR_CODE_ALREADY_IN_ROOM = 5;
  ERROR_CODE_NOT_IN_ROOM = 6;
  ERROR_CODE_PEER_NOT_FOUND = 7;
  ERROR_CODE_ROOM_FULL = 8;
  ERROR_CODE_INTERNAL = 9;
}
