[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/app-server",
    "crates/protocol",
    "crates/media-transport",
    "crates/media-audio",
    "crates/media-sfu",
    "crates/media-video",
    "crates/pg-test",
    "crates/messenger-client",
    "crates/tls",
    "crates/update",
    "tools/update-tool",
    "apps/launcher",
    "benchmarks/harness",
    "tools/media-probe",
    "tools/screen-probe",
]
# Vendored third-party crates and stand-alone tools are not workspace members.
exclude = ["third_party", "tools/apm-eval"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
turbo-pancake-protocol = { path = "crates/protocol" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# TLS support without bundled roots: clients pass their own rustls config (ADR 0014).
tokio-tungstenite = { version = "0.30", features = ["__rustls-tls"] }
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
# Messenger (S5, ADR 0013).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "time"] }
uuid = { version = "1", features = ["v4"] }
time = "0.3"
argon2 = "0.5"
base64 = "0.22"
aws-lc-rs = "1"
turbo-pancake-pg-test = { path = "crates/pg-test" }
turbo-pancake-tls = { path = "crates/tls" }
turbo-pancake-update = { path = "crates/update" }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }

# WebRTC APM build fixes for Windows/MSVC (third_party/webrtc-audio-processing-sys/README.md).
[patch.crates-io]
webrtc-audio-processing-sys = { path = "third_party/webrtc-audio-processing-sys/crate" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep debug builds small: full debug info only for workspace crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Real-time DSP is unusable unoptimised (debug builds of the client and the audio tests).
# media-audio itself is included because rubato's generics are instantiated there.
[profile.dev.package.turbo-pancake-media-audio]
opt-level = 3
[profile.dev.package.audioadapter]
opt-level = 3
[profile.dev.package.audioadapter-buffers]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.opusic-sys]
opt-level = 3
# Argon2id password hashing (19 MiB, 2 passes): seconds per hash unoptimised.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# NV12 → RGBA of every shown screen-share frame.
[profile.dev.package.turbo-pancake-media-video]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
