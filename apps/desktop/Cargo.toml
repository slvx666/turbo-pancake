[package]
name = "dsmini-desktop"
description = "DsMini native desktop client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dsmini-desktop"
path = "src/main.rs"

[dependencies]
# Qt backend deliberately excluded: winit + FemtoVG (OpenGL) with software fallback.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    # Window attribute hook (position, no-activate) and event-loop probe.
    # Pinned via Cargo.lock; revisit on Slint upgrades (API is unstable-flagged).
    "unstable-winit-030",
] }

[build-dependencies]
slint-build = "1.18"

[lints]
workspace = true
