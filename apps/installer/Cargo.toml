[package]
name = "turbo-pancake-installer"
description = "Per-user Windows installer with the release package embedded at build time (ADR 0017)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "turbo-pancake-setup"
path = "src/main.rs"

[dependencies]
turbo-pancake-setup.workspace = true
turbo-pancake-update = { workspace = true, default-features = false }

[lints]
workspace = true

[build-dependencies]
turbo-pancake-win-icon.workspace = true
