[package]
name = "turbo-pancake-app-server"
description = "turbo-pancake central application server: accounts, messages, signaling, SFU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "turbo-pancake-app-server"
path = "src/main.rs"

[dependencies]
turbo-pancake-protocol.workspace = true
turbo-pancake-media-sfu = { path = "../../crates/media-sfu" }
turbo-pancake-media-transport = { path = "../../crates/media-transport" }
anyhow.workspace = true
axum.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
futures-util.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
sqlx.workspace = true
uuid.workspace = true
time.workspace = true
argon2.workspace = true
base64.workspace = true
aws-lc-rs.workspace = true
prost.workspace = true
turbo-pancake-tls.workspace = true
tokio-rustls.workspace = true
turbo-pancake-update = { workspace = true, default-features = false }

[dev-dependencies]
turbo-pancake-pg-test.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
turbo-pancake-update.workspace = true

[lints]
workspace = true
