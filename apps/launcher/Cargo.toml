[package]
name = "turbo-pancake-launcher"
description = "Stable launcher in the install root: starts the current client version, trials a pending update and rolls back (ADR 0016)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "turbo-pancake"
path = "src/main.rs"

[dependencies]
turbo-pancake-update = { workspace = true, default-features = false }
turbo-pancake-setup.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints]
workspace = true
