[package]
name = "turbo-pancake-bench"
description = "Reproducible benchmark harness (startup, memory, signaling latency, idle connections)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "turbo-pancake-bench"
path = "src/main.rs"

[dependencies]
turbo-pancake-protocol.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[lints]
workspace = true
